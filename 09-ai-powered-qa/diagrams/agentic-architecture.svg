<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <marker id="a4g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#22c55e"/>
    </marker>
    <marker id="a4r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#f97316"/>
    </marker>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="820" height="400" rx="14" fill="#0f172a"/>
  <text x="410" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#f8fafc">3-Agent Agentic Testing Architecture</text>

  <!-- Input: Requirement -->
  <rect x="20" y="160" width="120" height="60" rx="10" fill="#1e293b" stroke="#6366f1" stroke-width="1.5"/>
  <text x="80" y="185" text-anchor="middle" font-size="12" fill="#a5b4fc">PRD /</text>
  <text x="80" y="201" text-anchor="middle" font-size="12" fill="#a5b4fc">User Story</text>

  <!-- PLANNER Agent -->
  <rect x="175" y="125" width="160" height="130" rx="12" fill="#1e1a3a" stroke="#818cf8" stroke-width="2.5" filter="url(#glow)"/>
  <text x="255" y="152" text-anchor="middle" font-size="15" font-weight="700" fill="#818cf8">🧠 PLANNER</text>
  <text x="255" y="172" text-anchor="middle" font-size="11" fill="#64748b">Phân tích Requirement</text>
  <text x="255" y="187" text-anchor="middle" font-size="11" fill="#64748b">→ Test Strategy</text>
  <text x="255" y="202" text-anchor="middle" font-size="11" fill="#64748b">→ Test Scenarios</text>
  <text x="255" y="220" text-anchor="middle" font-size="10" fill="#4f46e5">LLM: Claude / GPT-4o</text>
  <text x="255" y="235" text-anchor="middle" font-size="10" fill="#4f46e5">MCP: filesystem</text>

  <!-- GENERATOR Agent -->
  <rect x="370" y="125" width="170" height="130" rx="12" fill="#0a2416" stroke="#22c55e" stroke-width="2.5" filter="url(#glow)"/>
  <text x="455" y="152" text-anchor="middle" font-size="15" font-weight="700" fill="#22c55e">⚡ GENERATOR</text>
  <text x="455" y="172" text-anchor="middle" font-size="11" fill="#64748b">Đọc Accessibility Tree</text>
  <text x="455" y="187" text-anchor="middle" font-size="11" fill="#64748b">→ Playwright Code</text>
  <text x="455" y="202" text-anchor="middle" font-size="11" fill="#64748b">→ POM pattern</text>
  <text x="455" y="220" text-anchor="middle" font-size="10" fill="#166534">MCP: playwright-mcp</text>
  <text x="455" y="235" text-anchor="middle" font-size="10" fill="#166534">Browser: Chrome/FF</text>

  <!-- HEALER Agent -->
  <rect x="575" y="125" width="165" height="130" rx="12" fill="#2d1500" stroke="#f97316" stroke-width="2.5" filter="url(#glow)"/>
  <text x="657" y="152" text-anchor="middle" font-size="15" font-weight="700" fill="#f97316">🔧 HEALER</text>
  <text x="657" y="172" text-anchor="middle" font-size="11" fill="#64748b">Monitor test runs</text>
  <text x="657" y="187" text-anchor="middle" font-size="11" fill="#64748b">Selector fail?</text>
  <text x="657" y="202" text-anchor="middle" font-size="11" fill="#64748b">→ Đọc DOM snapshot</text>
  <text x="657" y="217" text-anchor="middle" font-size="11" fill="#64748b">→ Self-heal code</text>
  <text x="657" y="233" text-anchor="middle" font-size="10" fill="#9a3412">MCP: playwright-mcp</text>

  <!-- Arrows between agents -->
  <line x1="140" y1="190" x2="173" y2="190" stroke="#6366f1" stroke-width="2" marker-end="url(#a4)"/>
  <line x1="335" y1="190" x2="368" y2="190" stroke="#22c55e" stroke-width="2" marker-end="url(#a4g)"/>
  <line x1="540" y1="190" x2="573" y2="190" stroke="#f97316" stroke-width="2" marker-end="url(#a4r)"/>

  <!-- Labels below arrows -->
  <text x="154" y="183" text-anchor="middle" font-size="9" fill="#818cf8">Plan</text>
  <text x="352" y="183" text-anchor="middle" font-size="9" fill="#22c55e">Code</text>
  <text x="556" y="183" text-anchor="middle" font-size="9" fill="#f97316">Fix</text>

  <!-- Output -->
  <rect x="755" y="160" width="50" height="60" rx="10" fill="#14532d" stroke="#22c55e" stroke-width="1.5"/>
  <text x="780" y="185" text-anchor="middle" font-size="11" fill="#86efac">Test</text>
  <text x="780" y="201" text-anchor="middle" font-size="11" fill="#86efac">Suite</text>
  <line x1="740" y1="190" x2="753" y2="190" stroke="#22c55e" stroke-width="2" marker-end="url(#a4g)"/>

  <!-- Healer feedback loop -->
  <path d="M740,200 Q760,300 580,310 Q450,320 455,260" fill="none" stroke="#f97316" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#a4r)"/>
  <text x="620" y="330" text-anchor="middle" font-size="10" fill="#fb923c">Self-healing loop</text>

  <!-- Bottom key points -->
  <rect x="20" y="300" width="780" height="80" rx="10" fill="#1e293b"/>
  <text x="410" y="322" text-anchor="middle" font-size="13" font-weight="600" fill="#f8fafc">Key Differentiators vs Traditional Automation</text>
  <text x="140" y="344" text-anchor="middle" font-size="11" fill="#94a3b8">🌳 Accessibility Tree</text>
  <text x="140" y="360" text-anchor="middle" font-size="10" fill="#64748b">Không dùng Screenshot</text>
  <text x="340" y="344" text-anchor="middle" font-size="11" fill="#94a3b8">🔄 Self-Healing</text>
  <text x="340" y="360" text-anchor="middle" font-size="10" fill="#64748b">UI đổi → tự sửa selector</text>
  <text x="550" y="344" text-anchor="middle" font-size="11" fill="#94a3b8">🤖 Deterministic</text>
  <text x="550" y="360" text-anchor="middle" font-size="10" fill="#64748b">Ít hallucinate hơn Vision</text>
  <text x="720" y="344" text-anchor="middle" font-size="11" fill="#94a3b8">🔌 MCP Protocol</text>
  <text x="720" y="360" text-anchor="middle" font-size="10" fill="#64748b">Claude / Cursor / Gemini</text>
</svg>