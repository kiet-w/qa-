<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <filter id="shadow"><feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/></filter>
  </defs>
  <!-- Background -->
  <rect width="780" height="340" rx="12" fill="#0f172a"/>
  <text x="390" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#f8fafc">QA ⊃ QC ⊃ Testing</text>

  <!-- QA circle -->
  <circle cx="390" cy="185" r="145" fill="#1e3a5f" stroke="#3b82f6" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="390" y="68" text-anchor="middle" font-size="13" fill="#93c5fd">QA – Quality Assurance</text>
  <text x="390" y="85" text-anchor="middle" font-size="11" fill="#64748b">Quy trình • Phòng ngừa • Process</text>

  <!-- QC circle -->
  <circle cx="390" cy="190" r="100" fill="#1e3356" stroke="#6366f1" stroke-width="2" filter="url(#shadow)"/>
  <text x="390" y="112" text-anchor="middle" font-size="13" fill="#a5b4fc">QC – Quality Control</text>
  <text x="390" y="128" text-anchor="middle" font-size="11" fill="#64748b">Kiểm tra sản phẩm • Detective</text>

  <!-- Testing circle -->
  <circle cx="390" cy="195" r="58" fill="#1e2d4a" stroke="#22d3ee" stroke-width="2" filter="url(#shadow)"/>
  <text x="390" y="183" text-anchor="middle" font-size="13" fill="#67e8f9">Testing</text>
  <text x="390" y="200" text-anchor="middle" font-size="11" fill="#94a3b8">Thực thi tìm lỗi</text>
  <text x="390" y="215" text-anchor="middle" font-size="11" fill="#94a3b8">Execution</text>

  <!-- Labels bên ngoài -->
  <text x="565" y="155" font-size="11" fill="#94a3b8">Coding Standards</text>
  <text x="565" y="172" font-size="11" fill="#94a3b8">Review Process</text>
  <text x="565" y="189" font-size="11" fill="#94a3b8">CI/CD Rules</text>

  <text x="565" y="230" font-size="11" fill="#94a3b8">Test Execution</text>
  <text x="565" y="247" font-size="11" fill="#94a3b8">Bug Reporting</text>

  <!-- Legend -->
  <rect x="30" y="285" width="14" height="14" rx="3" fill="#3b82f6"/>
  <text x="50" y="296" font-size="11" fill="#94a3b8">QA: Phòng ngừa (Preventive)</text>
  <rect x="210" y="285" width="14" height="14" rx="3" fill="#6366f1"/>
  <text x="230" y="296" font-size="11" fill="#94a3b8">QC: Phát hiện (Detective)</text>
  <rect x="390" y="285" width="14" height="14" rx="3" fill="#22d3ee"/>
  <text x="410" y="296" font-size="11" fill="#94a3b8">Testing: Thực thi (Execution)</text>
</svg>