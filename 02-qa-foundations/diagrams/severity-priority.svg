<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" font-family="'Segoe UI', Arial, sans-serif">
  <rect width="700" height="400" rx="14" fill="#0f172a"/>
  <text x="350" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#f8fafc">Severity vs Priority Matrix</text>

  <!-- Axes -->
  <!-- Y axis: Severity -->
  <line x1="130" y1="60" x2="130" y2="355" stroke="#334155" stroke-width="1.5"/>
  <!-- X axis: Priority -->
  <line x1="130" y1="355" x2="660" y2="355" stroke="#334155" stroke-width="1.5"/>

  <!-- Y-axis label -->
  <text transform="translate(24,208) rotate(-90)" text-anchor="middle" font-size="13" font-weight="600" fill="#94a3b8">SEVERITY (Kỹ thuật)</text>
  <text x="95" y="90" text-anchor="middle" font-size="11" fill="#64748b">Critical</text>
  <text x="95" y="170" text-anchor="middle" font-size="11" fill="#64748b">Major</text>
  <text x="95" y="253" text-anchor="middle" font-size="11" fill="#64748b">Minor</text>
  <text x="95" y="335" text-anchor="middle" font-size="11" fill="#64748b">Trivial</text>

  <!-- X-axis label -->
  <text x="395" y="392" text-anchor="middle" font-size="13" font-weight="600" fill="#94a3b8">PRIORITY (Ưu tiên sửa)</text>
  <text x="218" y="372" text-anchor="middle" font-size="11" fill="#64748b">Low</text>
  <text x="345" y="372" text-anchor="middle" font-size="11" fill="#64748b">Medium</text>
  <text x="480" y="372" text-anchor="middle" font-size="11" fill="#64748b">High</text>
  <text x="610" y="372" text-anchor="middle" font-size="11" fill="#64748b">Urgent</text>

  <!-- Grid lines -->
  <line x1="130" y1="80" x2="660" y2="80" stroke="#1e293b" stroke-width="1"/>
  <line x1="130" y1="160" x2="660" y2="160" stroke="#1e293b" stroke-width="1"/>
  <line x1="130" y1="240" x2="660" y2="240" stroke="#1e293b" stroke-width="1"/>
  <line x1="218" y1="60" x2="218" y2="355" stroke="#1e293b" stroke-width="1"/>
  <line x1="345" y1="60" x2="345" y2="355" stroke="#1e293b" stroke-width="1"/>
  <line x1="480" y1="60" x2="480" y2="355" stroke="#1e293b" stroke-width="1"/>

  <!-- Q1: Critical-Urgent (red) -->
  <rect x="483" y="63" width="174" height="94" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
  <text x="570" y="103" text-anchor="middle" font-size="11" font-weight="600" fill="#fca5a5">🔴 FIX NOW</text>
  <text x="570" y="118" text-anchor="middle" font-size="10" fill="#f87171">Payment button broken</text>
  <text x="570" y="132" text-anchor="middle" font-size="10" fill="#f87171">on Safari → mất revenue</text>

  <!-- Q2: Critical-Low (orange) -->
  <rect x="133" y="63" width="84" height="94" rx="6" fill="#431407" stroke="#f97316" stroke-width="1.5"/>
  <text x="175" y="100" text-anchor="middle" font-size="11" font-weight="600" fill="#fb923c">⚠️ Investigate</text>
  <text x="175" y="116" text-anchor="middle" font-size="10" fill="#fdba74">Crash khi nhập</text>
  <text x="175" y="130" text-anchor="middle" font-size="10" fill="#fdba74">emoji (field ẩn)</text>

  <!-- Q3: Trivial-Urgent (purple) -->
  <rect x="483" y="243" width="174" height="109" rx="6" fill="#2e1065" stroke="#a855f7" stroke-width="1.5"/>
  <text x="570" y="285" text-anchor="middle" font-size="11" font-weight="600" fill="#d8b4fe">⚡ Quick Fix</text>
  <text x="570" y="300" text-anchor="middle" font-size="10" fill="#c084fc">Logo sai màu trên</text>
  <text x="570" y="315" text-anchor="middle" font-size="10" fill="#c084fc">trang chủ → brand</text>
  <text x="570" y="330" text-anchor="middle" font-size="10" fill="#c084fc">(trivial nhưng brand)</text>

  <!-- Q4: Trivial-Low (gray) -->
  <rect x="133" y="243" width="84" height="109" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="175" y="290" text-anchor="middle" font-size="11" font-weight="600" fill="#94a3b8">📌 Backlog</text>
  <text x="175" y="307" text-anchor="middle" font-size="10" fill="#64748b">Typo trong help</text>
  <text x="175" y="322" text-anchor="middle" font-size="10" fill="#64748b">text ít ai đọc</text>
</svg>