<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" font-family="'Segoe UI', Arial, sans-serif">
  <rect width="780" height="400" rx="14" fill="#0f172a"/>
  <text x="390" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#f8fafc">HTTP Status Codes – QA Cheat Sheet</text>

  <!-- 2xx -->
  <rect x="20" y="55" width="220" height="155" rx="10" fill="#14532d" stroke="#22c55e" stroke-width="2"/>
  <text x="130" y="78" text-anchor="middle" font-size="14" font-weight="700" fill="#86efac">2xx – Success ✅</text>
  <text x="130" y="100" text-anchor="middle" font-size="12" fill="#4ade80">200 OK</text>
  <text x="130" y="116" text-anchor="middle" font-size="10" fill="#86efac">Thành công, có data</text>
  <text x="130" y="136" text-anchor="middle" font-size="12" fill="#4ade80">201 Created</text>
  <text x="130" y="152" text-anchor="middle" font-size="10" fill="#86efac">POST tạo mới thành công</text>
  <text x="130" y="172" text-anchor="middle" font-size="12" fill="#4ade80">204 No Content</text>
  <text x="130" y="188" text-anchor="middle" font-size="10" fill="#86efac">DELETE thành công, no body</text>

  <!-- 3xx -->
  <rect x="260" y="55" width="220" height="155" rx="10" fill="#1e3a5f" stroke="#60a5fa" stroke-width="2"/>
  <text x="370" y="78" text-anchor="middle" font-size="14" font-weight="700" fill="#93c5fd">3xx – Redirect 🔀</text>
  <text x="370" y="100" text-anchor="middle" font-size="12" fill="#60a5fa">301 Moved Permanently</text>
  <text x="370" y="116" text-anchor="middle" font-size="10" fill="#93c5fd">URL đổi vĩnh viễn</text>
  <text x="370" y="136" text-anchor="middle" font-size="12" fill="#60a5fa">302 Found</text>
  <text x="370" y="152" text-anchor="middle" font-size="10" fill="#93c5fd">Tạm thời redirect</text>

  <!-- 4xx -->
  <rect x="500" y="55" width="260" height="155" rx="10" fill="#451a03" stroke="#f97316" stroke-width="2"/>
  <text x="630" y="78" text-anchor="middle" font-size="14" font-weight="700" fill="#fb923c">4xx – Client Error ⚠️</text>
  <text x="630" y="97" text-anchor="middle" font-size="11" fill="#fdba74">400 Bad Request – input sai format</text>
  <text x="630" y="113" text-anchor="middle" font-size="11" fill="#fdba74">401 Unauthorized – chưa đăng nhập</text>
  <text x="630" y="129" text-anchor="middle" font-size="11" fill="#fdba74">403 Forbidden – không có quyền</text>
  <text x="630" y="145" text-anchor="middle" font-size="11" fill="#fdba74">404 Not Found – resource mất</text>
  <text x="630" y="161" text-anchor="middle" font-size="11" fill="#fdba74">422 Validation Error – data sai</text>
  <text x="630" y="177" text-anchor="middle" font-size="11" fill="#fdba74">429 Rate Limit Exceeded</text>
  <text x="630" y="196" text-anchor="middle" font-size="11" fill="#fdba74">409 Conflict – email đã tồn tại</text>

  <!-- 5xx -->
  <rect x="20" y="230" width="740" height="120" rx="10" fill="#450a0a" stroke="#ef4444" stroke-width="2.5"/>
  <text x="390" y="255" text-anchor="middle" font-size="14" font-weight="700" fill="#fca5a5">5xx – Server Error 🔴 (Luôn là Bug – cần report ngay!)</text>
  <text x="200" y="280" text-anchor="middle" font-size="12" fill="#f87171">500 Internal Server Error</text>
  <text x="200" y="296" text-anchor="middle" font-size="10" fill="#fca5a5">Unhandled exception – code bị crash</text>
  <text x="390" y="280" text-anchor="middle" font-size="12" fill="#f87171">502 Bad Gateway</text>
  <text x="390" y="296" text-anchor="middle" font-size="10" fill="#fca5a5">Proxy không kết nối được backend</text>
  <text x="590" y="280" text-anchor="middle" font-size="12" fill="#f87171">503 Service Unavailable</text>
  <text x="590" y="296" text-anchor="middle" font-size="10" fill="#fca5a5">Server quá tải hoặc maintenance</text>

  <!-- QA Rule -->
  <rect x="20" y="365" width="740" height="28" rx="6" fill="#1e293b"/>
  <text x="390" y="383" text-anchor="middle" font-size="12" fill="#94a3b8">⚡ QA Rule: 4xx khi client gửi sai → đúng. Client sai mà API trả 500 → Bug!</text>
</svg>