<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="'Segoe UI', Arial, sans-serif">
  <rect width="760" height="320" rx="14" fill="#0f172a"/>
  <text x="380" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#f8fafc">Equivalence Partitioning + Boundary Value Analysis</text>
  <text x="380" y="55" text-anchor="middle" font-size="12" fill="#64748b">Ví dụ: Field "Tuổi" chấp nhận 18 – 65</text>

  <!-- Number line -->
  <line x1="60" y1="145" x2="700" y2="145" stroke="#334155" stroke-width="2"/>
  <!-- Arrows -->
  <polygon points="700,140 710,145 700,150" fill="#334155"/>

  <!-- Partition zones -->
  <!-- Invalid < 18 -->
  <rect x="60" y="100" width="220" height="90" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="1.5" fill-opacity="0.5"/>
  <text x="170" y="125" text-anchor="middle" font-size="13" fill="#fca5a5">Invalid (&lt; 18)</text>
  <text x="170" y="145" text-anchor="middle" font-size="11" fill="#f87171">Partition 1</text>

  <!-- Valid 18-65 -->
  <rect x="280" y="100" width="200" height="90" rx="8" fill="#14532d" stroke="#22c55e" stroke-width="1.5" fill-opacity="0.5"/>
  <text x="380" y="125" text-anchor="middle" font-size="13" fill="#86efac">Valid (18–65)</text>
  <text x="380" y="145" text-anchor="middle" font-size="11" fill="#4ade80">Partition 2</text>

  <!-- Invalid > 65 -->
  <rect x="480" y="100" width="220" height="90" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="1.5" fill-opacity="0.5"/>
  <text x="590" y="125" text-anchor="middle" font-size="13" fill="#fca5a5">Invalid (&gt; 65)</text>
  <text x="590" y="145" text-anchor="middle" font-size="11" fill="#f87171">Partition 3</text>

  <!-- BVA points on the line -->
  <!-- x=280 → 18, x=480 → 65 -->
  <!-- Boundary markers -->
  <circle cx="240" cy="145" r="7" fill="#94a3b8" stroke="#64748b" stroke-width="1.5"/>
  <text x="240" y="175" text-anchor="middle" font-size="12" fill="#94a3b8">17</text>
  <text x="240" y="190" text-anchor="middle" font-size="10" fill="#ef4444">✗</text>

  <circle cx="280" cy="145" r="8" fill="#22c55e" stroke="#16a34a" stroke-width="2"/>
  <text x="280" y="175" text-anchor="middle" font-size="12" fill="#22c55e" font-weight="700">18</text>
  <text x="280" y="190" text-anchor="middle" font-size="10" fill="#22c55e">✓</text>

  <circle cx="320" cy="145" r="7" fill="#22c55e" stroke="#16a34a" stroke-width="1.5"/>
  <text x="320" y="175" text-anchor="middle" font-size="12" fill="#22c55e">19</text>
  <text x="320" y="190" text-anchor="middle" font-size="10" fill="#22c55e">✓</text>

  <circle cx="380" cy="145" r="6" fill="#3b82f6" stroke="#2563eb" stroke-width="1.5"/>
  <text x="380" y="175" text-anchor="middle" font-size="12" fill="#93c5fd">30</text>
  <text x="380" y="190" text-anchor="middle" font-size="9" fill="#93c5fd">đại diện</text>

  <circle cx="440" cy="145" r="7" fill="#22c55e" stroke="#16a34a" stroke-width="1.5"/>
  <text x="440" y="175" text-anchor="middle" font-size="12" fill="#22c55e">64</text>
  <text x="440" y="190" text-anchor="middle" font-size="10" fill="#22c55e">✓</text>

  <circle cx="480" cy="145" r="8" fill="#22c55e" stroke="#16a34a" stroke-width="2"/>
  <text x="480" y="175" text-anchor="middle" font-size="12" fill="#22c55e" font-weight="700">65</text>
  <text x="480" y="190" text-anchor="middle" font-size="10" fill="#22c55e">✓</text>

  <circle cx="520" cy="145" r="7" fill="#94a3b8" stroke="#64748b" stroke-width="1.5"/>
  <text x="520" y="175" text-anchor="middle" font-size="12" fill="#94a3b8">66</text>
  <text x="520" y="190" text-anchor="middle" font-size="10" fill="#ef4444">✗</text>

  <!-- Legend -->
  <circle cx="100" cy="265" r="7" fill="#22c55e"/>
  <text x="115" y="270" font-size="12" fill="#86efac">BVA boundary (min, min+1, max-1, max)</text>
  <circle cx="450" cy="265" r="7" fill="#3b82f6"/>
  <text x="465" y="270" font-size="12" fill="#93c5fd">EP representative</text>

  <!-- Formula -->
  <text x="380" y="300" text-anchor="middle" font-size="12" fill="#475569">BVA formula: min-1, min, min+1 … max-1, max, max+1</text>
</svg>